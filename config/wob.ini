# On-screen volume bar. wob draws on the Wayland layer-shell, so unlike the
# desktop panel's indicator this stays visible over fullscreen video.
timeout = 1200
max = 100
width = 420
# Must exceed 2*(border_offset + border_size + bar_padding), or wob refuses
# to start with "height is too small".
height = 40
border_offset = 0
border_size = 3
bar_padding = 5
anchor = bottom
margin = 90
overflow_mode = nowrap
output_mode = focused

# Terracotta on charcoal, to match the launcher.
background_color = 17130FE6
bar_color = C4452EFF
border_color = F7F0E3CC
overflow_bar_color = E8318AFF
overflow_background_color = 17130FE6
overflow_border_color = F7F0E3CC
